[project]
name = "synthos-database"
version = "0.1.0"
description = "Database configuration and migrations for Synthos-OS"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"
