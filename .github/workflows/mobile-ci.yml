name: Mobile CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/mobile-client/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/mobile-client/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/mobile-client/package-lock.json
      - name: Install dependencies
        working-directory: apps/mobile-client
        run: npm ci
      - name: Run type check
        working-directory: apps/mobile-client
        run: npm run typecheck

  mobile-linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/mobile-client/package-lock.json
      - name: Install dependencies
        working-directory: apps/mobile-client
        run: npm ci
      - name: Run linting
        working-directory: apps/mobile-client
        run: npm run lint

  mobile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/mobile-client/package-lock.json
      - name: Install dependencies
        working-directory: apps/mobile-client
        run: npm ci
      - name: Run tests
        working-directory: apps/mobile-client
        run: npm test -- --passWithNoTests

  mobile-build-check:
    runs-on: ubuntu-latest
    needs: [mobile-typecheck, mobile-linting, mobile-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/mobile-client/package-lock.json
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        working-directory: apps/mobile-client
        run: npm ci
      - name: Check build configuration
        working-directory: apps/mobile-client
        run: eas build --platform ios --profile simulator --non-interactive --wait