name: Mobile Android Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/mobile-client/**'
      - '.github/workflows/mobile-android-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/mobile-client/**'
      - '.github/workflows/mobile-android-build.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (development, preview, production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/mobile-client/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: apps/mobile-client
        run: npm ci

      - name: Run type check
        working-directory: apps/mobile-client
        run: npm run typecheck

      - name: Run linting
        working-directory: apps/mobile-client
        run: npm run lint

      - name: Run tests
        working-directory: apps/mobile-client
        run: npm test -- --passWithNoTests

      - name: Determine build profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "profile=${{ github.event.inputs.profile }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "profile=production" >> $GITHUB_OUTPUT
          else
            echo "profile=preview" >> $GITHUB_OUTPUT
          fi

      - name: Build Android app
        working-directory: apps/mobile-client
        run: eas build --platform android --profile ${{ steps.profile.outputs.profile }} --non-interactive
        env:
          EXPO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.EXPO_ANDROID_KEYSTORE_PASSWORD }}
          EXPO_ANDROID_KEY_PASSWORD: ${{ secrets.EXPO_ANDROID_KEY_PASSWORD }}

      - name: Upload build artifacts
        if: steps.profile.outputs.profile != 'development'
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ steps.profile.outputs.profile }}
          path: |
            apps/mobile-client/*.apk
            apps/mobile-client/*.aab
          retention-days: 7

  android-simulator-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/mobile-client/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: apps/mobile-client
        run: npm ci

      - name: Build for Android Emulator
        working-directory: apps/mobile-client
        run: eas build --platform android --profile simulator --non-interactive

  android-submit:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: android-build
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to Google Play Store
        working-directory: apps/mobile-client
        run: eas submit --platform android --non-interactive
        env:
          EXPO_ANDROID_SERVICE_ACCOUNT_KEY: ${{ secrets.EXPO_ANDROID_SERVICE_ACCOUNT_KEY }}
