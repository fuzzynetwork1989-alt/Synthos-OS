apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: synthos
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    scrape_configs:
      - job_name: 'synthos-services'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - synthos
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: (api-gateway|model-gateway|memory-engine|rsi-engine)
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:8080
      
      - job_name: 'ollama'
        static_configs:
          - targets: ['ollama:11434']
      
      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres:5432']
      
      - job_name: 'redis'
        static_configs:
          - targets: ['redis:6379']